# Sumber kebenaran roster agent. Dibaca oleh "pnpm aos apply-profiles" dan "pnpm aos doctor".
profiles:
  - name: chief
    description: Chief of Staff - pintu masuk Telegram, memecah brief jadi kartu kanban, briefing pagi.
    tier: os-brain
    docker_network: false
    gateway: true
  - name: researcher
    description: Riset web, ringkasan, dan perbandingan; hasil ditulis ke workspace kartu.
    tier: os-worker
    docker_network: false
  - name: secretary
    description: Reminder, catatan, jadwal, dan kerapian kanban; satu-satunya yang menangani data pribadi owner.
    tier: os-private
    docker_network: false
  - name: content
    description: Riset tren, ide, dan draft konten; belum boleh publish.
    tier: os-worker
    docker_network: false
  - name: dev
    description: Membaca, mengubah, dan menguji kode di sandbox Docker.
    tier: os-brain
    docker_network: true
    egress_proxy: true
